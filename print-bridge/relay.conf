# POSx Print Bridge - Relay Configuration
# The bridge connects to this backend URL via WebSocket.
# Printing works from any browser on any device — no Chrome flags, no cert setup.

BACKEND_URL=https://posx-suite.onrender.com

# OUTLET_ID: use "default" for single-outlet setup.
# For multi-outlet, set to the outlet ID this PC serves (e.g. "main", "bar").
OUTLET_ID=default
